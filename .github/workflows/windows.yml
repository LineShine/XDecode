name: Windows

on:
  push:
    branches: [windows]
  pull_request:
    branches: [windows, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test-package:
    runs-on: windows-2025
    defaults:
      run:
        shell: pwsh
    env:
      VCPKG_INSTALLED_DIR: ${{ github.workspace }}\Windows\vcpkg_installed
      XDECODE_VERSION: 1.0.0
      INNO_SETUP_VERSION: 7.0.2
      HAS_WINDOWS_SIGNING_CERTIFICATE: ${{ secrets.WINDOWS_SIGNING_PFX_BASE64 != '' }}
      HAS_INNO_SETUP_LICENSE: ${{ secrets.INNO_SETUP_LICENSE_KEY != '' }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - uses: microsoft/setup-msbuild@v2

      - uses: actions/checkout@v4
        with:
          repository: microsoft/vcpkg
          ref: 56bb2411609227288b70117ead2c47585ba07713
          path: .vcpkg
          fetch-depth: 0

      - name: Bootstrap vcpkg
        run: .\.vcpkg\bootstrap-vcpkg.bat -disableMetrics

      - name: Restore native dependency
        run: >
          .\.vcpkg\vcpkg.exe install
          --x-manifest-root=${{ github.workspace }}\Windows
          --x-install-root=$env:VCPKG_INSTALLED_DIR
          --triplet=x64-windows

      - name: Test Core
        run: >
          dotnet test Windows\tests\XDecode.Core.Tests\XDecode.Core.Tests.csproj
          -c Release
          -p:Platform=x64
          -p:VcpkgInstalledDir=$env:VCPKG_INSTALLED_DIR

      - name: Test Application
        run: >
          dotnet test Windows\tests\XDecode.Application.Tests\XDecode.Application.Tests.csproj
          -c Release
          -p:Platform=x64
          -p:VcpkgInstalledDir=$env:VCPKG_INSTALLED_DIR

      - name: Test Windows integration
        run: >
          dotnet test Windows\tests\XDecode.Windows.Tests\XDecode.Windows.Tests.csproj
          -c Release
          -p:Platform=x64
          -p:VcpkgInstalledDir=$env:VCPKG_INSTALLED_DIR

      - name: Build Release x64
        run: >
          msbuild Windows\XDecode.Windows.sln
          /restore
          /m:1
          /p:Configuration=Release
          /p:Platform=x64
          /p:AppxPackageSigningEnabled=false
          /p:VcpkgInstalledDir=$env:VCPKG_INSTALLED_DIR

      - name: Publish self-contained unpackaged app
        run: |
          $publishDirectory = Join-Path "${{ runner.temp }}" 'xdecode-publish'
          dotnet publish Windows\src\XDecode.Windows\XDecode.Windows.csproj `
            -c Release `
            -r win-x64 `
            --self-contained true `
            -o $publishDirectory `
            -p:Platform=x64 `
            -p:WindowsPackageType=None `
            -p:WindowsAppSDKSelfContained=true `
            -p:DebugType=None `
            -p:DebugSymbols=false `
            -p:VcpkgInstalledDir=$env:VCPKG_INSTALLED_DIR
          if ($LASTEXITCODE -ne 0) { throw "dotnet publish failed" }

          $explorerCommand = Get-ChildItem Windows `
            -Recurse -Filter XDecode.ExplorerCommand.dll |
            Where-Object FullName -Match '\\x64\\Release\\' |
            Select-Object -First 1
          if (-not $explorerCommand) { throw "XDecode.ExplorerCommand.dll was not built" }
          Copy-Item -LiteralPath $explorerCommand.FullName -Destination $publishDirectory
          if (-not (Test-Path (Join-Path $publishDirectory 'zlib1.dll'))) {
            throw "The publish directory does not contain zlib1.dll"
          }
          "XDECODE_PUBLISH_DIRECTORY=$publishDirectory" |
            Out-File $env:GITHUB_ENV -Append -Encoding utf8

      - name: Decode signing certificate
        if: ${{ env.HAS_WINDOWS_SIGNING_CERTIFICATE == 'true' }}
        env:
          WINDOWS_SIGNING_PFX_BASE64: ${{ secrets.WINDOWS_SIGNING_PFX_BASE64 }}
          WINDOWS_SIGNING_PASSWORD: ${{ secrets.WINDOWS_SIGNING_PASSWORD }}
        run: |
          [IO.File]::WriteAllBytes(
            "${{ runner.temp }}\xdecode-signing.pfx",
            [Convert]::FromBase64String($env:WINDOWS_SIGNING_PFX_BASE64))
          $certificate = [Security.Cryptography.X509Certificates.X509Certificate2]::new(
            "${{ runner.temp }}\xdecode-signing.pfx",
            $env:WINDOWS_SIGNING_PASSWORD,
            [Security.Cryptography.X509Certificates.X509KeyStorageFlags]::EphemeralKeySet)

      - name: Install verified Inno Setup
        if: ${{ env.HAS_WINDOWS_SIGNING_CERTIFICATE == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $fileName = "innosetup-$env:INNO_SETUP_VERSION-x64.exe"
          $installer = Join-Path "${{ runner.temp }}" $fileName
          $release = "is-$($env:INNO_SETUP_VERSION.Replace('.', '_'))"
          $downloaded = $false
          for ($attempt = 1; $attempt -le 3; $attempt++) {
            gh release download $release --repo jrsoftware/issrc --pattern $fileName `
              --dir "${{ runner.temp }}" --clobber
            if ($LASTEXITCODE -eq 0 -and (Test-Path -LiteralPath $installer -PathType Leaf)) {
              $downloaded = $true
              break
            }
            if ($attempt -lt 3) { Start-Sleep -Seconds (5 * $attempt) }
          }
          if (-not $downloaded) { throw "Inno Setup download failed after 3 attempts" }

          $verified = $false
          Push-Location "${{ runner.temp }}"
          try {
            for ($attempt = 1; $attempt -le 3; $attempt++) {
              gh release verify-asset $fileName --repo jrsoftware/issrc
              if ($LASTEXITCODE -eq 0) {
                $verified = $true
                break
              }
              if ($attempt -lt 3) { Start-Sleep -Seconds (5 * $attempt) }
            }
          }
          finally { Pop-Location }
          if (-not $verified) {
            throw "Inno Setup release asset verification failed after 3 attempts"
          }
          $signature = Get-AuthenticodeSignature -LiteralPath $installer
          if ($signature.Status -ne 'Valid' -or
              $signature.SignerCertificate.Subject -notmatch 'CN=Pyrsys B\.V\.') {
            throw "Inno Setup download signature verification failed"
          }
          $installDirectory = Join-Path "${{ runner.temp }}" 'InnoSetup7'
          $process = Start-Process -FilePath $installer -Wait -PassThru -ArgumentList @(
            '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/CURRENTUSER',
            "/DIR=$installDirectory")
          if ($process.ExitCode -ne 0) {
            throw "Inno Setup installation failed with exit code $($process.ExitCode)"
          }
          $compiler = Join-Path $installDirectory 'ISCC.exe'
          if (-not (Test-Path -LiteralPath $compiler -PathType Leaf)) {
            throw "ISCC.exe was not installed"
          }
          "INNO_COMPILER=$compiler" | Out-File $env:GITHUB_ENV -Append -Encoding utf8

      - name: Configure Inno Setup commercial license
        if: >-
          ${{ env.HAS_WINDOWS_SIGNING_CERTIFICATE == 'true' &&
              env.HAS_INNO_SETUP_LICENSE == 'true' }}
        env:
          INNO_SETUP_LICENSE_KEY: ${{ secrets.INNO_SETUP_LICENSE_KEY }}
        run: |
          $path = 'HKCU:\Software\Jordan Russell\Inno Setup\License'
          New-Item -Path $path -Force | Out-Null
          New-ItemProperty -Path $path -Name LicenseKey `
            -Value $env:INNO_SETUP_LICENSE_KEY -PropertyType String -Force | Out-Null

      - name: Build signed setup.exe
        if: ${{ env.HAS_WINDOWS_SIGNING_CERTIFICATE == 'true' }}
        env:
          WINDOWS_SIGNING_PASSWORD: ${{ secrets.WINDOWS_SIGNING_PASSWORD }}
        run: |
          & .\Windows\installer\build-setup.ps1 `
            -PublishDirectory $env:XDECODE_PUBLISH_DIRECTORY `
            -SigningPfxPath "${{ runner.temp }}\xdecode-signing.pfx" `
            -Version $env:XDECODE_VERSION `
            -OutputDirectory "${{ github.workspace }}\Windows\installer\Output" `
            -InnoCompiler $env:INNO_COMPILER

      - name: Install setup.exe smoke test
        if: ${{ env.HAS_WINDOWS_SIGNING_CERTIFICATE == 'true' }}
        env:
          WINDOWS_SIGNING_PASSWORD: ${{ secrets.WINDOWS_SIGNING_PASSWORD }}
        run: |
          $setup = Get-ChildItem Windows\installer\Output -Filter *.exe |
            Select-Object -First 1
          if (-not $setup) { throw "setup.exe was not produced" }
          $certificate = [Security.Cryptography.X509Certificates.X509Certificate2]::new(
            "${{ runner.temp }}\xdecode-signing.pfx",
            $env:WINDOWS_SIGNING_PASSWORD,
            [Security.Cryptography.X509Certificates.X509KeyStorageFlags]::EphemeralKeySet)

          $signature = Get-AuthenticodeSignature -LiteralPath $setup.FullName
          if ($null -eq $signature.SignerCertificate -or
              $signature.SignerCertificate.Thumbprint -ne $certificate.Thumbprint) {
            throw "setup.exe signer does not match the configured signer"
          }

          $logPath = "${{ runner.temp }}\xdecode-setup.log"
          $installDirectory = Join-Path $env:LOCALAPPDATA 'Programs\XDecode'
          $appPath = Join-Path $installDirectory 'XDecode.Windows.exe'
          $tracePath = "${{ runner.temp }}\xdecode-startup.log"
          $launchTime = Get-Date
          $uninstallKey =
            'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\LineShine.XDecode.Setup_is1'
          $process = $null
          try {
            $installer = Start-Process -FilePath $setup.FullName -Wait -PassThru -ArgumentList @(
              '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', "/LOG=$logPath")
            if ($installer.ExitCode -ne 0) {
              if (Test-Path $logPath) { Get-Content $logPath }
              throw "setup.exe failed with exit code $($installer.ExitCode)"
            }
            if (-not (Test-Path -LiteralPath $appPath -PathType Leaf)) {
              throw "setup.exe did not install XDecode.Windows.exe"
            }

            $expectedVersion = [version]"$($env:XDECODE_VERSION).0"
            $actualVersion = [version](Get-Item -LiteralPath $appPath).VersionInfo.FileVersion
            if ($actualVersion -ne $expectedVersion) {
              throw "setup.exe installed version $actualVersion, expected $expectedVersion"
            }

            foreach ($signedFile in @(
              $appPath,
              (Join-Path $installDirectory 'XDecode.ExplorerCommand.dll'))) {
              $installedSignature = Get-AuthenticodeSignature -LiteralPath $signedFile
              if ($null -eq $installedSignature.SignerCertificate -or
                  $installedSignature.SignerCertificate.Thumbprint -ne $certificate.Thumbprint) {
                throw "$signedFile is not signed by the configured certificate"
              }
            }

            if (-not (Test-Path $uninstallKey) -or
                -not (Test-Path 'HKCU:\Software\Classes\XDecode.Log') -or
                -not (Test-Path -LiteralPath 'HKCU:\Software\Classes\*\shell\XDecodeDecrypt') -or
                -not (Get-ItemProperty `
                  'HKCU:\Software\Microsoft\Windows\CurrentVersion\Run' `
                  -Name XDecode -ErrorAction SilentlyContinue)) {
              throw "setup.exe did not register uninstall, file, Explorer, and startup integration"
            }

            $env:XDECODE_STARTUP_TRACE = $tracePath
            $process = Start-Process -FilePath $appPath -PassThru
            $deadline = [DateTime]::UtcNow.AddSeconds(30)
            do {
              Start-Sleep -Milliseconds 500
              $process.Refresh()
              if ($process.HasExited) {
                throw "XDecode exited during launch with code $($process.ExitCode)"
              }
            } while ($process.MainWindowHandle -eq 0 -and [DateTime]::UtcNow -lt $deadline)
            if ($process.MainWindowHandle -eq 0) {
              throw "XDecode did not create its main window within 30 seconds"
            }
            Start-Sleep -Seconds 10
            $process.Refresh()
            if ($process.HasExited) {
              throw "XDecode exited during the launch survival check with code $($process.ExitCode)"
            }

            $sizeMiB = [Math]::Round($setup.Length / 1MB, 2)
            "Validated XDecode setup: $sizeMiB MiB"
          }
          finally {
            if (Test-Path -LiteralPath $tracePath) {
              "XDecode startup trace:"
              Get-Content -LiteralPath $tracePath
            }
            Get-WinEvent -FilterHashtable @{
              LogName = 'Application'
              StartTime = $launchTime
            } -ErrorAction SilentlyContinue |
              Where-Object Message -Like '*XDecode.Windows.exe*' |
              Select-Object TimeCreated, Id, ProviderName, Message |
              Format-List
            if ($null -ne $process -and -not $process.HasExited) {
              Stop-Process -Id $process.Id -Force
              $process.WaitForExit()
            }
            if (Test-Path $uninstallKey) {
              $uninstaller = (Get-ItemProperty $uninstallKey).UninstallString.Trim('"')
              $uninstall = Start-Process -FilePath $uninstaller -Wait -PassThru -ArgumentList @(
                '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART')
              if ($uninstall.ExitCode -ne 0) {
                throw "XDecode uninstall failed with code $($uninstall.ExitCode)"
              }
            }
          }

          if ((Test-Path -LiteralPath $installDirectory) -or
              (Test-Path $uninstallKey) -or
              (Test-Path 'HKCU:\Software\Classes\XDecode.Log') -or
              (Test-Path -LiteralPath 'HKCU:\Software\Classes\*\shell\XDecodeDecrypt')) {
            throw "XDecode uninstall left application files or registry integration behind"
          }

      - name: Upload setup.exe
        if: ${{ always() && env.HAS_WINDOWS_SIGNING_CERTIFICATE == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: XDecode-Windows-x64-setup
          path: Windows/installer/Output/XDecode-Setup-x64.exe
          if-no-files-found: error

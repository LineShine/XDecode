<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 18 18">
  <defs>
    <mask id="document-cutouts" maskUnits="userSpaceOnUse" x="0" y="0" width="18" height="18">
      <rect width="18" height="18" fill="#fff"/>

      <!-- Fold seam. -->
      <path
        d="M11.85 1.35v2.8c0 .58.47 1.05 1.05 1.05h2.8"
        fill="none"
        stroke="#000"
        stroke-width="0.72"
        stroke-linecap="round"
        stroke-linejoin="round"
      />

      <!-- The branded X and the opening beneath its zipper pull. -->
      <path
        d="M3.15 4.05h3L9 7.28l2.85-3.23h3L10.52 8.9l4.33 4.85h-3L9 10.52l-2.85 3.23h-3L7.48 8.9z"
        fill="#000"
      />
      <path
        d="M8.18 10.25h1.64v.92l.5.72v4.86H7.68v-4.86l.5-.72z"
        fill="#000"
      />
    </mask>

    <mask id="pull-ring" maskUnits="userSpaceOnUse" x="7.6" y="11" width="2.8" height="3.8">
      <rect x="7.6" y="11" width="2.8" height="3.8" fill="#fff"/>
      <rect x="8.55" y="12.15" width="0.9" height="1.45" rx="0.36" fill="#000"/>
    </mask>
  </defs>

  <path
    d="M2.75 1.2h8.95l4.1 4.1v9.75c0 .97-.78 1.75-1.75 1.75H3.95A1.75 1.75 0 0 1 2.2 15.05V2.75c0-.86.69-1.55 1.55-1.55z"
    fill="#000"
    mask="url(#document-cutouts)"
  />

  <!-- Rounded inset cuts that reproduce the original asymmetric X. -->
  <g fill="#000">
    <rect x="4.15" y="5.1" width="1.55" height="0.5" rx="0.25"/>
    <rect x="4.55" y="6.12" width="1.55" height="0.5" rx="0.25"/>
    <rect x="4.55" y="11.18" width="1.55" height="0.5" rx="0.25"/>
    <rect x="4.15" y="12.2" width="1.55" height="0.5" rx="0.25"/>
  </g>
  <g fill="none" stroke="#000" stroke-width="0.58" stroke-linecap="round">
    <path d="M12.75 5.05 10.95 7.1"/>
    <path d="m10.95 10.7 1.8 2.05"/>
  </g>

  <!-- Alternating teeth form a real interlocking zipper rather than a ladder. -->
  <g fill="#000">
    <rect x="8.02" y="6.35" width="1.25" height="0.55" rx="0.18"/>
    <rect x="8.73" y="7.08" width="1.25" height="0.55" rx="0.18"/>
    <rect x="8.02" y="7.81" width="1.25" height="0.55" rx="0.18"/>
    <rect x="8.73" y="8.54" width="1.25" height="0.55" rx="0.18"/>
    <rect x="8.02" y="9.27" width="1.25" height="0.55" rx="0.18"/>
    <rect x="8.73" y="10" width="1.25" height="0.55" rx="0.18"/>

    <!-- Slider, connector, and rounded pull ring. -->
    <rect x="8.1" y="10.63" width="1.8" height="0.88" rx="0.3"/>
    <rect x="8.7" y="11.35" width="0.6" height="0.65" rx="0.22"/>
    <rect
      x="7.85"
      y="11.78"
      width="2.3"
      height="2.7"
      rx="0.78"
      mask="url(#pull-ring)"
    />
  </g>
</svg>
